name: Build iOS app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project TikSticker.xcodeproj -scheme TikSticker \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/TikSticker.app || { grep -B2 -A8 "error:" build.log | head -150; exit 1; }

      - name: Make .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TikSticker.app Payload/
          zip -qry TikSticker.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TikSticker-ipa
          path: TikSticker.ipa

      - name: Publish as a release (easy download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" TikSticker.ipa \
            --title "TikSticker (build ${{ github.run_number }})" \
            --notes "نزّل TikSticker.ipa وثبّته على الآيفون بـ Sideloadly." --latest
