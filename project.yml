name: TikSticker
options:
  bundleIdPrefix: com.kab
  deploymentTarget:
    iOS: "16.0"
packages:
  libwebp:
    url: https://github.com/SDWebImage/libwebp-Xcode
    from: "1.5.0"
targets:
  TikSticker:
    type: application
    platform: iOS
    sources: [TikSticker]
    dependencies:
      - package: libwebp
    scheme: {}
    info:
      path: TikSticker/Info.plist
      properties:
        CFBundleDisplayName: "استيكرات تيك توك"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: ar
        LSApplicationQueriesSchemes: [whatsapp]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: "عشان تختار فيديو تسجيل الشاشة اللي فيه الاستيكر"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kab.tiksticker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
